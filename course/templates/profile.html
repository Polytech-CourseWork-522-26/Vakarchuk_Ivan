<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій профіль - SmartCook</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/theme.js"></script>
</head>
<body>

<header class="navbar">
    <a href="/" class="logo">SmartCook 🍳</a>
    <nav>
        <a href="/">Головна</a>
        <a href="/favorites">Обране</a>
        <a href="/shopping-list">Список покупок</a>
        <a href="/create">Додати рецепт</a>
        <a href="/profile" class="active">👤 Профіль</a>
        {{#isAdmin}}
        <a href="/admin" style="color: var(--danger); font-weight: bold;">⚙️ Адмін</a>
        {{/isAdmin}}
    </nav>
    
</header>

<div class="shopping-container" style="margin-top: 50px;">
    <div class="shopping-card">
        
        <!-- Заголовок -->
        <div style="text-align: center; margin-bottom: 40px;">
            <div style="width: 120px; height: 120px; margin: 0 auto 20px; 
                        background: var(--brand-gradient); 
                        border-radius: 50%; display: flex; align-items: center; 
                        justify-content: center; font-size: 52px; color: white;
                        box-shadow: var(--shadow-md);">
                👤
            </div>
            <h1 style="margin:0; font-size: 28px; font-weight: 800; color: var(--text-primary);">{{session_username}}</h1>
            <p style="color: var(--text-secondary); margin-top: 8px; font-size: 15px;">Особистий профіль</p>
        </div>

        <!-- РЕЖИМ ПЕРЕГЛЯДУ -->
        <div id="view-mode">
            <div class="input-group">
                <label>Email</label>
                <div id="view-email" class="view-value"></div>
            </div>
            <div class="input-group">
                <label>Дієта</label>
                <div id="view-diet" class="view-value"></div>
            </div>
            <div class="input-group">
                <label>Алергії</label>
                <div id="view-allergies" class="view-value"></div>
            </div>

            <button onclick="switchToEdit()" class="btn btn-primary" style="margin-top: 25px; width: 100%;">
                ✏️ Редагувати профіль
            </button>
            <a href="/logout" class="btn btn-danger" style="margin-top: 12px; width: 100%; text-decoration: none;">
                🚪 Вийти з акаунта
            </a>
        </div>

        <!-- РЕЖИМ РЕДАГУВАННЯ -->
        <div id="edit-mode" style="display: none;">
            <form id="profile-form">
                <div class="input-group">
                    <label for="email">Email <span style="color: var(--danger);">*</span></label>
                    <input type="email" id="email" required placeholder="Введіть email">
                </div>
                <div class="input-group">
                    <label for="diet">Дієта</label>
                    <input type="text" id="diet" placeholder="Keto, Vegan, Сушка...">
                </div>
                <div class="input-group">
                    <label for="allergies">Алергії</label>
                    <input type="text" id="allergies" placeholder="Арахіс, Молоко, Томати...">
                </div>

                <div style="margin-top: 30px; display: flex; gap: 12px;">
                    <button type="submit" class="btn btn-primary" style="flex:1;">
                        💾 Зберегти зміни
                    </button>
                    <button type="button" onclick="switchToView()" class="btn btn-gray" style="flex:1;">
                        Скасувати
                    </button>
                </div>

                <span id="message" class="error-message" style="text-align: center; margin-top: 15px; font-weight: 700;"></span>
            </form>
        </div>
    </div>
</div>

<script src="/static/js/profile.js"></script>
</body>
</html>
